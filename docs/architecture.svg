<rect x="830" y="290" width="36" height="16" rx="4" fill="#0969da"/><text x="848" y="302" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<rect x="620" y="290" width="36" height="16" rx="4" fill="#0969da"/><text x="638" y="302" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<rect x="402" y="402" width="36" height="16" rx="4" fill="#0969da"/><text x="420" y="414" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<rect x="620" y="582" width="36" height="16" rx="4" fill="#0969da"/><text x="638" y="594" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<rect x="402" y="826" width="36" height="16" rx="4" fill="#0969da"/><text x="420" y="838" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<text x="132" y="214" font-size="11.5" text-anchor="start" fill="#57606a">facts</text>
<text x="361" y="256" font-size="11.5" text-anchor="start" fill="#57606a">report search</text>
<text x="361" y="386" font-size="11.5" text-anchor="start" fill="#57606a">what changed</text>
<text x="612" y="556" font-size="11.5" text-anchor="end" fill="#57606a">decision</text>
<text x="512" y="556" font-size="11.5" text-anchor="end" fill="#57606a">retry if wrong</text>
<text x="463" y="608" font-size="11.5" text-anchor="middle" fill="#57606a">ok</text>
<text x="143" y="556" font-size="11.5" text-anchor="start" fill="#57606a">starts runs</text>
<text x="24" y="924" font-size="11.5" fill="#57606a">v2: the AI moved from the Mac to Groq's cloud, a fourth agent reads what changed in the annual report,</text>
<text x="24" y="940" font-size="11.5" fill="#57606a">code hands the agents exact facts and repairs citations, and the screens became a live trading desk.</text>
