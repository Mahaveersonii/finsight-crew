<text x="24" y="32" font-size="15" font-weight="600" fill="#1f2328">Every decision: data in, three AI agents on Groq, code checks the facts, then the risk officer</text>
<text x="24" y="52" font-size="11.5" fill="#57606a">FinSight Crew v2 - the same pipeline runs for the US and India markets - NEW marks what changed in v2</text>
