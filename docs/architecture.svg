<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 856" width="760" height="856" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Every trade: data in, three AI agents, guardrails, then the risk officer">
<rect width="760" height="856" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<text x="24" y="32" font-size="15" font-weight="600" fill="#1f2328">Every trade: data in, three AI agents, guardrails, then the risk officer</text>
<text x="24" y="52" font-size="11.5" fill="#57606a">FinSight Crew - the same pipeline runs for the US and India markets</text>
<rect x="24" y="264" width="712" height="164" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="40" y="412" font-weight="600" fill="#1f2328">The AI team (CrewAI) - Qwen3 8B on Ollama, backups qwen3:8b and llama3.2</text>
<path d="M134 148V278" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M380 148V174" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M626 148V174" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M380 232V278" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M248 324H274" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M484 324H510" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M656 368V466" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M552 468V370" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M512 512H486" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M144 468V430" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M248 512H274" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M380 556V594" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M380 668V710" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M484 632H616V710" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M248 748H274" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="24" y="76" width="220" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="40" y="100" font-weight="600" fill="#1f2328">Yahoo Finance</text>
<text x="40" y="116" font-size="11.5" fill="#57606a">live prices, company numbers</text>
<text x="40" y="132" font-size="11.5" fill="#57606a">both markets</text>
<rect x="270" y="76" width="220" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="286" y="100" font-weight="600" fill="#1f2328">SEC EDGAR (US)</text>
<text x="286" y="116" font-size="11.5" fill="#57606a">10-K annual reports</text>
<text x="286" y="132" font-size="11.5" fill="#57606a">backup company numbers</text>
<rect x="516" y="76" width="220" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="532" y="100" font-weight="600" fill="#1f2328">Report bot (India)</text>
<text x="532" y="116" font-size="11.5" fill="#57606a">annual-report PDFs</text>
<text x="532" y="132" font-size="11.5" fill="#57606a">checked: robots, PDF, FY26</text>
<rect x="270" y="176" width="466" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="286" y="200" font-weight="600" fill="#1f2328">Report library (RAG)</text>
<text x="286" y="216" font-size="11.5" fill="#57606a">US 1,523 + India 2,187 passages in ChromaDB, cited to the page</text>
<rect x="40" y="280" width="208" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="56" y="304" font-weight="600" fill="#1f2328">1. Data Extractor</text>
<text x="56" y="320" font-size="11.5" fill="#57606a">collects price and trend</text>
<text x="56" y="336" font-size="11.5" fill="#57606a">revenue, profit, debt</text>
<text x="56" y="352" font-size="11.5" fill="#57606a">writes the data brief</text>
<rect x="276" y="280" width="208" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="292" y="304" font-weight="600" fill="#1f2328">2. Financial Analyst</text>
<text x="292" y="320" font-size="11.5" fill="#57606a">values the share (DCF)</text>
<text x="292" y="336" font-size="11.5" fill="#57606a">quotes the annual report</text>
<text x="292" y="352" font-size="11.5" fill="#57606a">verdict and score 0-100</text>
<rect x="512" y="280" width="208" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="528" y="304" font-weight="600" fill="#1f2328">3. Portfolio Manager</text>
<text x="528" y="320" font-size="11.5" fill="#57606a">decides BUY, HOLD or SELL</text>
<text x="528" y="336" font-size="11.5" fill="#57606a">confidence and share count</text>
<text x="528" y="352" font-size="11.5" fill="#57606a">checks the portfolio first</text>
<rect x="40" y="468" width="208" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="56" y="492" font-weight="600" fill="#1f2328">Schedulers (US, India)</text>
<text x="56" y="508" font-size="11.5" fill="#57606a">prices: every 15 min</text>
<text x="56" y="524" font-size="11.5" fill="#57606a">in market hours</text>
<text x="56" y="540" font-size="11.5" fill="#57606a">crew: weekdays after close</text>
<rect x="276" y="468" width="208" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="292" y="492" font-weight="600" fill="#1f2328">Risk officer (code)</text>
<text x="292" y="508" font-size="11.5" fill="#1f2328">enforces every fund rule</text>
<text x="292" y="524" font-size="11.5" fill="#1f2328">sets stop-loss and size</text>
<text x="292" y="540" font-size="11.5" fill="#1f2328">score under 70 means HOLD</text>
<rect x="512" y="468" width="208" height="88" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
<text x="528" y="492" font-weight="600" fill="#1f2328">Guardrails (code)</text>
<text x="528" y="508" font-size="11.5" fill="#1f2328">format and tool use checked</text>
<text x="528" y="524" font-size="11.5" fill="#1f2328">citations must be real</text>
<text x="528" y="540" font-size="11.5" fill="#1f2328">numbers fact-checked</text>
<rect x="276" y="596" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="292" y="620" font-weight="600" fill="#1f2328">PostgreSQL</text>
<text x="292" y="636" font-size="11.5" fill="#57606a">one database per market</text>
<text x="292" y="652" font-size="11.5" fill="#57606a">trades, positions, logs</text>
<rect x="40" y="712" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="56" y="736" font-weight="600" fill="#1f2328">You</text>
<text x="56" y="752" font-size="11.5" fill="#57606a">type a ticker, press Run</text>
<text x="56" y="768" font-size="11.5" fill="#57606a">or ask the report</text>
<rect x="276" y="712" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="292" y="736" font-weight="600" fill="#1f2328">Streamlit website</text>
<text x="292" y="752" font-size="11.5" fill="#57606a">US :8502 - India :8503</text>
<text x="292" y="768" font-size="11.5" fill="#57606a">switch button in sidebar</text>
<rect x="512" y="712" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="528" y="736" font-weight="600" fill="#1f2328">Grafana dashboards</text>
<text x="528" y="752" font-size="11.5" fill="#57606a">Market dropdown: US / India</text>
<text x="528" y="768" font-size="11.5" fill="#57606a">fund, tool calls, recoveries</text>
<text x="142" y="214" font-size="11.5" text-anchor="start" fill="#57606a">facts</text>
<text x="388" y="256" font-size="11.5" text-anchor="start" fill="#57606a">report search</text>
<text x="648" y="452" font-size="11.5" text-anchor="end" fill="#57606a">decision card</text>
<text x="544" y="452" font-size="11.5" text-anchor="end" fill="#57606a">retry if wrong</text>
<text x="499" y="504" font-size="11.5" text-anchor="middle" fill="#57606a">ok</text>
<text x="152" y="452" font-size="11.5" text-anchor="start" fill="#57606a">starts runs</text>
<text x="24" y="816" font-size="11.5" fill="#57606a">Docker runs everything except Ollama, which uses the Mac's graphics chip.</text>
<text x="24" y="832" font-size="11.5" fill="#57606a">Each market has its own database, scheduler and Streamlit app.</text>
</svg>