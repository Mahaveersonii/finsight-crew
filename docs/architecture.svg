<rect x="24" y="76" width="200" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="40" y="100" font-weight="600" fill="#1f2328">Yahoo Finance</text>
<text x="40" y="116" font-size="11.5" fill="#57606a">prices refreshed every minute</text>
<text x="40" y="132" font-size="11.5" fill="#57606a">company numbers, both markets</text>
<rect x="244" y="76" width="200" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="260" y="100" font-weight="600" fill="#1f2328">SEC EDGAR (US)</text>
<text x="260" y="116" font-size="11.5" fill="#57606a">10-K annual reports</text>
<text x="260" y="132" font-size="11.5" fill="#57606a">backup company numbers</text>
<rect x="464" y="76" width="200" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="480" y="100" font-weight="600" fill="#1f2328">Report bot (India)</text>
<text x="480" y="116" font-size="11.5" fill="#57606a">annual-report PDFs</text>
<text x="480" y="132" font-size="11.5" fill="#57606a">checked: robots, PDF, FY26</text>
<rect x="244" y="176" width="420" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="260" y="200" font-weight="600" fill="#1f2328">Report library (RAG)</text>
<text x="260" y="216" font-size="11.5" fill="#57606a">10-K and annual-report passages in ChromaDB, cited to the page</text>
<rect x="700" y="176" width="176" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="716" y="200" font-weight="600" fill="#1f2328">Ollama (Mac)</text>
<text x="716" y="216" font-size="11.5" fill="#57606a">turns text into vectors</text>
<rect x="700" y="280" width="176" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="716" y="304" font-weight="600" fill="#1f2328">Groq cloud AI</text>
<text x="716" y="320" font-size="11.5" fill="#1f2328">gpt-oss-120b (main)</text>
<text x="716" y="336" font-size="11.5" fill="#1f2328">backups: 20b, Qwen 3.8</text>
<text x="716" y="352" font-size="11.5" fill="#1f2328">200K tokens a day each</text>
<rect x="40" y="280" width="190" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="56" y="304" font-weight="600" fill="#1f2328">1. Data Extractor</text>
<text x="56" y="320" font-size="11.5" fill="#57606a">price, trend and</text>
<text x="56" y="336" font-size="11.5" fill="#57606a">company numbers</text>
<text x="56" y="352" font-size="11.5" fill="#57606a">writes the data brief</text>
<rect x="258" y="280" width="190" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="274" y="304" font-weight="600" fill="#1f2328">2. Financial Analyst</text>
<text x="274" y="320" font-size="11.5" fill="#57606a">values the share (DCF)</text>
<text x="274" y="336" font-size="11.5" fill="#57606a">quotes the annual report</text>
<text x="274" y="352" font-size="11.5" fill="#57606a">verdict and score 0-100</text>
<rect x="476" y="280" width="190" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="492" y="304" font-weight="600" fill="#1f2328">3. Portfolio Manager</text>
<text x="492" y="320" font-size="11.5" fill="#57606a">gets an exact fact sheet</text>
<text x="492" y="336" font-size="11.5" fill="#57606a">decides BUY, HOLD or SELL</text>
<text x="492" y="352" font-size="11.5" fill="#57606a">hands in a JSON decision</text>
<rect x="40" y="468" width="190" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="56" y="492" font-weight="600" fill="#1f2328">Schedulers (US, India)</text>
<text x="56" y="508" font-size="11.5" fill="#57606a">every 15 min: prices, stops</text>
<text x="56" y="524" font-size="11.5" fill="#57606a">after the close: agents</text>
<text x="56" y="540" font-size="11.5" fill="#57606a">run on the Mac</text>
<rect x="258" y="468" width="190" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="274" y="492" font-weight="600" fill="#1f2328">Risk officer (code)</text>
<text x="274" y="508" font-size="11.5" fill="#1f2328">score under 70 means HOLD</text>
<text x="274" y="524" font-size="11.5" fill="#1f2328">sets stop-loss and size</text>
<text x="274" y="540" font-size="11.5" fill="#1f2328">10% stock, 30% sector caps</text>
<rect x="476" y="468" width="190" height="88" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
<text x="492" y="492" font-weight="600" fill="#1f2328">Guardrails (code)</text>
<text x="492" y="508" font-size="11.5" fill="#1f2328">format and tool use checked</text>
<text x="492" y="524" font-size="11.5" fill="#1f2328">citations matched or fixed</text>
<text x="492" y="540" font-size="11.5" fill="#1f2328">numbers fact-checked</text>
<rect x="258" y="596" width="190" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="274" y="620" font-weight="600" fill="#1f2328">Paper broker (code)</text>
<text x="274" y="636" font-size="11.5" fill="#57606a">fills while market is open</text>
<text x="274" y="652" font-size="11.5" fill="#57606a">queues orders when closed</text>
<rect x="476" y="596" width="190" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="492" y="620" font-weight="600" fill="#1f2328">PostgreSQL (Docker)</text>
<text x="492" y="636" font-size="11.5" fill="#57606a">one database per market</text>
<text x="492" y="652" font-size="11.5" fill="#57606a">decisions, trades, audit log</text>
<rect x="700" y="596" width="176" height="188" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
<text x="716" y="620" font-weight="600" fill="#1f2328">Where it runs</text>
<text x="716" y="636" font-size="11.5" fill="#1f2328">Mac: both apps, the</text>
<text x="716" y="652" font-size="11.5" fill="#1f2328">schedulers and Ollama</text>
<text x="716" y="668" font-size="11.5" fill="#1f2328">Docker: PostgreSQL and</text>
<text x="716" y="684" font-size="11.5" fill="#1f2328">Grafana</text>
<text x="716" y="700" font-size="11.5" fill="#1f2328">Groq cloud: AI models</text>
<text x="716" y="716" font-size="11.5" fill="#1f2328">Internet: Yahoo, SEC,</text>
<text x="716" y="732" font-size="11.5" fill="#1f2328">company websites</text>
<text x="716" y="748" font-size="11.5" fill="#1f2328">All on free plans</text>
<rect x="40" y="712" width="190" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="56" y="736" font-weight="600" fill="#1f2328">You</text>
<text x="56" y="752" font-size="11.5" fill="#57606a">pick a stock, press Run</text>
<text x="56" y="768" font-size="11.5" fill="#57606a">or ask the report</text>
<rect x="258" y="712" width="190" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="274" y="736" font-weight="600" fill="#1f2328">Streamlit app</text>
<text x="274" y="752" font-size="11.5" fill="#57606a">trading desk, live prices</text>
<text x="274" y="768" font-size="11.5" fill="#57606a">US :8502 - India :8503</text>
<rect x="476" y="712" width="190" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="492" y="736" font-weight="600" fill="#1f2328">Grafana (Docker)</text>
<text x="492" y="752" font-size="11.5" fill="#57606a">Market dropdown: US / India</text>
<text x="492" y="768" font-size="11.5" fill="#57606a">fund and agent health</text>
<rect x="830" y="186" width="36" height="16" rx="4" fill="#0969da"/><text x="848" y="198" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<rect x="830" y="290" width="36" height="16" rx="4" fill="#0969da"/><text x="848" y="302" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<rect x="620" y="290" width="36" height="16" rx="4" fill="#0969da"/><text x="638" y="302" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<rect x="620" y="478" width="36" height="16" rx="4" fill="#0969da"/><text x="638" y="490" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<rect x="402" y="722" width="36" height="16" rx="4" fill="#0969da"/><text x="420" y="734" font-size="10" font-weight="600" text-anchor="middle" fill="#ffffff">NEW</text>
<text x="132" y="214" font-size="11.5" text-anchor="start" fill="#57606a">facts</text>
<text x="361" y="256" font-size="11.5" text-anchor="start" fill="#57606a">report search</text>
<text x="612" y="452" font-size="11.5" text-anchor="end" fill="#57606a">decision</text>
<text x="512" y="452" font-size="11.5" text-anchor="end" fill="#57606a">retry if wrong</text>
<text x="463" y="504" font-size="11.5" text-anchor="middle" fill="#57606a">ok</text>
<text x="143" y="452" font-size="11.5" text-anchor="start" fill="#57606a">starts runs</text>
<text x="24" y="820" font-size="11.5" fill="#57606a">v2: the AI moved from the Mac to Groq's cloud, code hands the agents exact facts and repairs citations,</text>
<text x="24" y="836" font-size="11.5" fill="#57606a">and the screens became a live trading desk. Each market has its own database, scheduler and app.</text>
