apiVersion: 1
# The US data source was renamed from "FinSight Postgres"; remove the old entry so the uid can be reused.
deleteDatasources:
  - name: FinSight Postgres
    orgId: 1
datasources:
  - name: US market ($)
    uid: finsight-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: finsight
    isDefault: true
    secureJsonData:
      password: finsight
    jsonData:
      database: finsight
      sslmode: disable
      postgresVersion: 1600
  - name: India market (₹)
    uid: finsight-pg-in
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: finsight
    secureJsonData:
      password: finsight
    jsonData:
      database: finsight_in
      sslmode: disable
      postgresVersion: 1600
