<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 964" width="900" height="964" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Every decision: data in, four AI agents on Groq, code checks the facts, then the risk officer">
