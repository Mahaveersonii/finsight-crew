<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" width="1800" height="1050" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="1800" height="1050" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6472"/></marker></defs>
<text x="40" y="44" font-size="24" font-weight="700" fill="#1F2630">FinSight Crew v2: how the Python files connect</text>
<text x="40" y="70" font-size="14" fill="#5B6472">Arrows show the main flow, from the file that calls to the file it uses. The small grey line in each box says what else it uses.</text>
<rect x="30" y="84" width="1740" height="110" rx="12" fill="#FAFBFC" stroke="#6F84A6" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="101" font-size="13" font-weight="700" fill="#6F84A6">1. Entry points: you start these</text>
<rect x="30" y="244" width="1740" height="110" rx="12" fill="#FAFBFC" stroke="#C98A2B" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="261" font-size="13" font-weight="700" fill="#C98A2B">2. Orchestration</text>
<rect x="30" y="414" width="1740" height="110" rx="12" fill="#FAFBFC" stroke="#6E62D0" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="431" font-size="13" font-weight="700" fill="#6E62D0">3. Agents and AI</text>
<rect x="30" y="594" width="1740" height="110" rx="12" fill="#FAFBFC" stroke="#3A7BC8" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="611" font-size="13" font-weight="700" fill="#3A7BC8">4. Services</text>
<rect x="30" y="764" width="1740" height="110" rx="12" fill="#FAFBFC" stroke="#2F9C78" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="781" font-size="13" font-weight="700" fill="#2F9C78">5. Helpers</text>
<path d="M170 180 V228 H400 V268" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="285" y="220" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">terminal run</text>
<path d="M460 180 V268" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="468" y="214" font-size="12.5" text-anchor="start" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">Run button</text>
<path d="M710 180 V228 H520 V268" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="615" y="220" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">daily run</text>
<path d="M790 180 V196 H1185 V600 H1290 V618" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1193" y="470" font-size="12.5" text-anchor="start" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">every 15 min</text>
<path d="M580 305 H1185" fill="none" stroke="#5B6472" stroke-width="1.6"/>
<circle cx="1185" cy="305" r="4" fill="#5B6472"/>
<text x="880" y="297" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">size + trade</text>
<path d="M1330 180 V268" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1338" y="224" font-size="12.5" text-anchor="start" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">replay</text>
<path d="M460 340 V438" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="468" y="394" font-size="12.5" text-anchor="start" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">run the agents</text>
<path d="M400 340 V384 H170 V438" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="285" y="376" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">choose model</text>
<path d="M580 475 H628" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="604" y="432" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">calls tools</text>
<path d="M870 475 H918" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="894" y="432" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">what changed</text>
<path d="M750 510 V618" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="758" y="590" font-size="12.5" text-anchor="start" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">prices</text>
<path d="M700 510 V560 H460 V618" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="580" y="552" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">DCF, score</text>
<path d="M800 510 V560 H1040 V618" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="920" y="552" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">report search</text>
<path d="M1450 655 H1498" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1474" y="646" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">open?</text>
<path d="M1000 690 V740 H750 V788" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="875" y="732" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">PDF pages</text>
<path d="M1080 690 V788" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1088" y="744" font-size="12.5" text-anchor="start" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">missing PDF</text>
<path d="M1740 145 H1768 V825 H1162" fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1460" y="817" font-size="12.5" text-anchor="middle" fill="#1F2630" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">download + verify</text>
<rect x="50" y="110" width="240" height="70" rx="10" fill="#EEF2F7" stroke="#6F84A6" stroke-width="1.6"/>
<text x="170" y="132" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">scripts/run_crew.py</text>
<text x="170" y="152" font-size="12.5" text-anchor="middle" fill="#2F3742">Analyse a stock in the terminal</text>
<text x="170" y="169" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">--dry-run = no trade</text>
<rect x="340" y="110" width="240" height="70" rx="10" fill="#EEF2F7" stroke="#6F84A6" stroke-width="1.6"/>
<text x="460" y="132" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">app/streamlit_app.py</text>
<text x="460" y="152" font-size="12.5" text-anchor="middle" fill="#2F3742">Trading-desk website, 7 tabs</text>
<text x="460" y="169" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">uses ui.py + most services</text>
<rect x="630" y="110" width="240" height="70" rx="10" fill="#EEF2F7" stroke="#6F84A6" stroke-width="1.6"/>
<text x="750" y="132" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/scheduler.py</text>
<text x="750" y="152" font-size="12.5" text-anchor="middle" fill="#2F3742">Autopilot: 15-min + daily runs</text>
<text x="750" y="169" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">also: rag, filing_changes</text>
<rect x="920" y="110" width="240" height="70" rx="10" fill="#EEF2F7" stroke="#6F84A6" stroke-width="1.6"/>
<text x="1040" y="132" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">eval/run_rag_eval.py</text>
<text x="1040" y="152" font-size="12.5" text-anchor="middle" fill="#2F3742">Tests report-search accuracy</text>
<text x="1040" y="169" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">uses: rag</text>
<rect x="1210" y="110" width="240" height="70" rx="10" fill="#EEF2F7" stroke="#6F84A6" stroke-width="1.6"/>
<text x="1330" y="132" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">scripts/run_backtest.py</text>
<text x="1330" y="152" font-size="12.5" text-anchor="middle" fill="#2F3742">Replays 4 years of prices</text>
<text x="1330" y="169" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">saves results to eval/</text>
<rect x="1500" y="110" width="240" height="70" rx="10" fill="#EEF2F7" stroke="#6F84A6" stroke-width="1.6"/>
<text x="1620" y="132" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">scripts/fetch_annual_reports.py</text>
<text x="1620" y="152" font-size="12.5" text-anchor="middle" fill="#2F3742">Downloads 6 Indian reports</text>
<text x="1620" y="169" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">and verifies each PDF</text>
<rect x="340" y="270" width="240" height="70" rx="10" fill="#FDF3E3" stroke="#C98A2B" stroke-width="1.6"/>
<text x="460" y="292" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/pipeline.py</text>
<text x="460" y="312" font-size="12.5" text-anchor="middle" fill="#2F3742">Runs ONE analysis end to end</text>
<text x="460" y="329" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">data, agents, policy, trade, save</text>
<rect x="1210" y="270" width="240" height="70" rx="10" fill="#FDF3E3" stroke="#C98A2B" stroke-width="1.6"/>
<text x="1330" y="292" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/backtest.py</text>
<text x="1330" y="312" font-size="12.5" text-anchor="middle" fill="#2F3742">Momentum rules, no AI</text>
<text x="1330" y="329" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">uses: market_data</text>
<rect x="50" y="440" width="240" height="70" rx="10" fill="#EFEDFE" stroke="#6E62D0" stroke-width="1.6"/>
<text x="170" y="462" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/llm.py</text>
<text x="170" y="482" font-size="12.5" text-anchor="middle" fill="#2F3742">Picks the AI model</text>
<text x="170" y="499" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">gpt-oss-120b, 20b, Qwen</text>
<rect x="340" y="440" width="240" height="70" rx="10" fill="#EFEDFE" stroke="#6E62D0" stroke-width="1.6"/>
<text x="460" y="462" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/crew.py</text>
<text x="460" y="482" font-size="12.5" text-anchor="middle" fill="#2F3742">3 agents + fact sheet</text>
<text x="460" y="499" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">guardrail checks the decision</text>
<rect x="630" y="440" width="240" height="70" rx="10" fill="#EFEDFE" stroke="#6E62D0" stroke-width="1.6"/>
<text x="750" y="462" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/tools/crew_tools.py</text>
<text x="750" y="482" font-size="12.5" text-anchor="middle" fill="#2F3742">10 tools the agents call</text>
<text x="750" y="499" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">cached, logged, never crash</text>
<rect x="920" y="440" width="240" height="70" rx="10" fill="#EFEDFE" stroke="#6E62D0" stroke-width="1.6"/>
<text x="1040" y="462" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/filing_changes.py</text>
<text x="1040" y="482" font-size="12.5" text-anchor="middle" fill="#2F3742">Agent 4: 10-K vs last year</text>
<text x="1040" y="499" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">uses: rag, llm</text>
<rect x="340" y="620" width="240" height="70" rx="10" fill="#E6F0FB" stroke="#3A7BC8" stroke-width="1.6"/>
<text x="460" y="642" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/tools/valuation.py</text>
<text x="460" y="662" font-size="12.5" text-anchor="middle" fill="#2F3742">RSI, ATR, DCF, quant score</text>
<text x="460" y="679" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">pure maths, no internet</text>
<rect x="630" y="620" width="240" height="70" rx="10" fill="#E6F0FB" stroke="#3A7BC8" stroke-width="1.6"/>
<text x="750" y="642" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/tools/market_data.py</text>
<text x="750" y="662" font-size="12.5" text-anchor="middle" fill="#2F3742">Prices + company numbers</text>
<text x="750" y="679" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">Yahoo, SEC backup, cache</text>
<rect x="920" y="620" width="240" height="70" rx="10" fill="#E6F0FB" stroke="#3A7BC8" stroke-width="1.6"/>
<text x="1040" y="642" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/rag.py</text>
<text x="1040" y="662" font-size="12.5" text-anchor="middle" fill="#2F3742">Report library + search</text>
<text x="1040" y="679" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">also answers Ask the Report</text>
<rect x="1210" y="620" width="240" height="70" rx="10" fill="#E6F0FB" stroke="#3A7BC8" stroke-width="1.6"/>
<text x="1330" y="642" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/broker.py</text>
<text x="1330" y="662" font-size="12.5" text-anchor="middle" fill="#2F3742">Risk engine + paper broker</text>
<text x="1330" y="679" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">size, fill or queue, stops</text>
<rect x="1500" y="620" width="240" height="70" rx="10" fill="#E6F0FB" stroke="#3A7BC8" stroke-width="1.6"/>
<text x="1620" y="642" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/market_clock.py</text>
<text x="1620" y="662" font-size="12.5" text-anchor="middle" fill="#2F3742">NYSE / NSE opening hours</text>
<text x="1620" y="679" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">open now? next open?</text>
<rect x="630" y="790" width="240" height="70" rx="10" fill="#E5F5EF" stroke="#2F9C78" stroke-width="1.6"/>
<text x="750" y="812" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/pdf_reports.py</text>
<text x="750" y="832" font-size="12.5" text-anchor="middle" fill="#2F3742">Reads Indian PDFs</text>
<text x="750" y="849" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">keeps narrative pages</text>
<rect x="920" y="790" width="240" height="70" rx="10" fill="#E5F5EF" stroke="#2F9C78" stroke-width="1.6"/>
<text x="1040" y="812" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1F2630">finsight/report_bot.py</text>
<text x="1040" y="832" font-size="12.5" text-anchor="middle" fill="#2F3742">Downloads Indian reports</text>
<text x="1040" y="849" font-size="11" font-style="italic" text-anchor="middle" fill="#6B7380">respects robots.txt</text>
<rect x="30" y="898" width="1740" height="50" rx="12" fill="#F1F0EC" stroke="#8A887F" stroke-width="1.2"/>
<text x="900" y="928" font-size="13.5" text-anchor="middle" fill="#2F3742">6. Foundation, used by every file:   config.py reads .env (market, models, risk rules)   ·   markets.py holds US vs India settings   ·   db.py stores 6 tables (runs, signals, trades, positions, snapshots, events)</text>
<rect x="30" y="968" width="1740" height="50" rx="12" fill="#FFFFFF" stroke="#8A887F" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="900" y="998" font-size="13.5" text-anchor="middle" fill="#2F3742">7. Outside services:   Yahoo Finance ← market_data   ·   SEC EDGAR ← market_data, rag, filing_changes   ·   Groq AI ← llm   ·   Ollama + ChromaDB ← rag   ·   PostgreSQL ← db   ·   Company websites ← report_bot   ·   Browser → streamlit_app</text>
</svg>